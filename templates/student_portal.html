<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CUI CampusBot | Student Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-950 text-white font-[Inter] min-h-screen">
    <section class="max-w-7xl mx-auto p-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-gray-900 rounded-2xl p-6 border border-cyan-500/20">
          <h2 class="text-2xl font-bold text-cyan-400 mb-5">📅 View Timetable</h2>

          <div class="flex gap-3 mb-4">
            <input
              type="text"
              id="class-code"
              placeholder="Enter class code"
              class="flex-1 px-4 py-3 rounded-lg bg-gray-800 border border-gray-700"
            />

            <button
              onclick="viewTimetable()"
              class="px-5 py-3 bg-cyan-600 rounded-lg hover:bg-cyan-700"
            >
              View
            </button>
          </div>

          <div class="flex gap-3 mb-4 flex-wrap">
            <button
              onclick="downloadTimetable()"
              class="px-5 py-3 bg-green-600 rounded-lg hover:bg-green-700"
            >
              Download Timetable
            </button>

            <button
              onclick="downloadFullTimetable()"
              class="px-5 py-3 bg-purple-600 rounded-lg hover:bg-purple-700"
            >
              Download Full Timetable
            </button>
          </div>

          <iframe
            id="pdf-viewer"
            class="w-full h-[700px] rounded-xl bg-black"
            title="Timetable PDF Viewer"
          ></iframe>
        </div>

        <div class="bg-gray-900 rounded-2xl p-6 border border-cyan-500/20">
          <h2 class="text-2xl font-bold text-cyan-400 mb-5">
            📢 Notifications & Notices
          </h2>

          <div id="notifications-container" class="space-y-4"></div>
        </div>
      </div>
    </section>

    <script src="/static/js/student_portal.js"></script>
  </body>
</html>
