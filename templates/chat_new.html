<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CUI Campus Bot | Live Chat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --dark-charcoal: #050d14;
        --electric-blue: #00ffff;
        --cui-primary-dark: #003d72;
        --cui-accent-green: #00b1a0;
        --subtle-gray: #1f2937;
        --error-red: #ef4444;
      }

      body {
        background-color: var(--dark-charcoal);
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
      }

      @keyframes fadeInSlideUp {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animated-element {
        opacity: 0;
        animation: fadeInSlideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
      }

      .delay-100 {
        animation-delay: 0.1s;
      }
      .delay-300 {
        animation-delay: 0.3s;
      }
      .delay-500 {
        animation-delay: 0.5s;
      }

      @keyframes pulseGlow {
        0% {
          box-shadow: 0 0 10px rgba(0, 255, 255, 0.55);
        }
        50% {
          box-shadow: 0 0 40px rgba(0, 255, 255, 0.95);
        }
        100% {
          box-shadow: 0 0 10px rgba(0, 255, 255, 0.55);
        }
      }

      .pulse-glow {
        animation: pulseGlow 2.8s infinite ease-in-out;
      }

      .chat-hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 4.5rem 1rem 2rem;
        background-image:
          linear-gradient(rgba(5, 13, 20, 0.88), rgba(5, 13, 20, 0.92)),
          url('/static/images/c.jpg');
        background-size: cover;
        background-position: center;
      }

      .chat-card {
        background-color: var(--subtle-gray);
        border: 3px solid var(--electric-blue);
        border-radius: 1rem;
        position: relative;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.25);
      }

      .chat-inner {
        background: #0d1117;
        border: 1px solid #1f2937;
        border-radius: 0.75rem;
        padding: 1rem 1.25rem 1.25rem;
      }

      .status-bar {
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding-bottom: 0.65rem;
        margin-bottom: 0.85rem;
        border-bottom: 1px solid #1f2937;
        color: #6b7280;
      }

      .status-left {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status-bar span.indicator {
        width: 0.65rem;
        height: 0.65rem;
        background: #00ff9d;
        border-radius: 50%;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .user-badge {
        background: rgba(0, 255, 255, 0.1);
        border: 1px solid rgba(0, 255, 255, 0.3);
        padding: 0.25rem 0.6rem;
        border-radius: 0.4rem;
        font-size: 0.7rem;
        color: var(--electric-blue);
      }

      .logout-btn {
        background: transparent;
        border: 1px solid #374151;
        color: #9ca3af;
        padding: 0.25rem 0.5rem;
        border-radius: 0.35rem;
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .logout-btn:hover {
        border-color: var(--error-red);
        color: var(--error-red);
      }

      .messages-wrapper {
        height: 50vh;
        max-height: 500px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        scrollbar-width: thin;
      }

      .msg {
        font-size: 0.85rem;
        line-height: 1.5rem;
        padding: 0.7rem 0.85rem;
        border-radius: 0.65rem;
        max-width: 85%;
        word-wrap: break-word;
        white-space: pre-wrap;
      }

      .msg.user {
        align-self: flex-end;
        background: rgba(0, 255, 255, 0.12);
        color: var(--electric-blue);
        border: 1px solid rgba(0, 255, 255, 0.4);
      }

      .msg.bot {
        align-self: flex-start;
        background: #1f2937;
        color: #d1d5db;
        border: 1px solid #2d3d4d;
      }

      .msg.bot.typing {
        color: #6b7280;
        font-style: italic;
      }

      .msg-sources {
        font-size: 0.7rem;
        color: #6b7280;
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid #374151;
      }

      .msg-sources span {
        background: rgba(0, 177, 160, 0.2);
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        margin-right: 0.35rem;
        color: var(--cui-accent-green);
      }

      .input-row {
        position: relative;
        display: block;
        background: #101721;
        border: 1px solid #1f2937;
        border-radius: 0.9rem;
        padding: 0.35rem 0.9rem 0.35rem 1rem;
        margin-top: 1rem;
      }

      .input-row input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: #e5e7eb;
        font-size: 0.95rem;
        padding: 0.65rem 3.4rem 0.65rem 0.1rem;
      }

      .send-btn {
        position: absolute;
        top: 50%;
        right: 0.65rem;
        transform: translateY(-50%);
        background: #0b1320;
        color: var(--electric-blue);
        border: 2px solid var(--electric-blue);
        height: 2.3rem;
        padding: 0 0.9rem;
        border-radius: 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        font-weight: 600;
        transition:
          background 0.2s,
          box-shadow 0.2s,
          transform 0.15s;
        cursor: pointer;
      }

      .send-btn:hover {
        background: rgba(0, 255, 255, 0.15);
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        transform: translateY(calc(-50% - 1px));
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .logo-mini {
        width: 48px;
        height: 48px;
      }

      .page-title {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 900;
        margin-bottom: 1.5rem;
      }

      .nav-links {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 60;
        display: flex;
        gap: 0.5rem;
      }

      .nav-link {
        background: #0b1320;
        color: var(--electric-blue);
        border: 2px solid var(--electric-blue);
        border-radius: 0.5rem;
        padding: 0.35rem 0.7rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.8rem;
        text-decoration: none;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        transition: background 0.2s;
      }

      .nav-link:hover {
        background: rgba(0, 255, 255, 0.1);
      }

      .error-banner {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid var(--error-red);
        color: var(--error-red);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        display: none;
      }

      @media (max-width: 768px) {
        .chat-hero {
          padding: 3.5rem 0.75rem 1.5rem;
        }
        .page-title {
          font-size: 2rem;
        }
        .logo-mini {
          width: 36px;
          height: 36px;
        }
        .chat-card {
          width: 100%;
          border-width: 2px;
        }
        .chat-inner {
          padding: 0.75rem;
        }
        .messages-wrapper {
          height: 55vh;
          max-height: none;
        }
        .msg {
          max-width: 90%;
          font-size: 0.82rem;
        }
        .status-bar {
          flex-wrap: wrap;
          gap: 0.35rem;
        }
        .user-info {
          flex-wrap: wrap;
          gap: 0.35rem;
        }
        .input-row {
          padding: 0.25rem 0.6rem 0.25rem 0.75rem;
        }
        .input-row input {
          font-size: 0.9rem;
          padding-right: 3rem;
        }
        .send-btn {
          height: 2.1rem;
          padding: 0 0.65rem;
          font-size: 0.7rem;
          right: 0.45rem;
        }
      }

      @media (max-width: 480px) {
        .chat-hero {
          padding: 3rem 0.5rem 1rem;
        }
        .page-title {
          font-size: 1.6rem;
        }
        .logo-mini {
          width: 32px;
          height: 32px;
        }
        .chat-inner {
          padding: 0.6rem;
        }
        .status-bar {
          font-size: 0.65rem;
        }
        .messages-wrapper {
          height: 50vh;
          gap: 0.4rem;
        }
        .msg {
          max-width: 92%;
          font-size: 0.78rem;
          padding: 0.5rem 0.6rem;
          line-height: 1.35rem;
        }
        .input-row input {
          font-size: 0.85rem;
          padding: 0.5rem 2.8rem 0.5rem 0.1rem;
        }
        .send-btn {
          height: 1.9rem;
          padding: 0 0.5rem;
          font-size: 0.65rem;
          right: 0.35rem;
        }
        .send-btn span {
          display: none;
        }
        .nav-links {
          top: 10px;
          left: 10px;
        }
      }

      @media (max-width: 360px) {
        .page-title {
          font-size: 1.4rem;
        }
        .messages-wrapper {
          height: 45vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="nav-links">
      <a href="/" class="nav-link">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
      </a>
    </div>

    <section class="chat-hero">
      <div
        class="flex justify-center items-center gap-4 mb-6 animated-element delay-100"
      >
        <img
          src="/static/images/comsats-logo.svg"
          alt="CUI Logo"
          class="logo-mini"
        />
        <h1 class="page-title">
          <span style="color: #d1d5db">CUI</span>
          <span style="color: var(--electric-blue)">Campus Bot</span>
        </h1>
      </div>

      <div
        class="max-w-4xl w-full mx-auto chat-card animated-element delay-300"
      >
        <div class="chat-inner">
          <div id="error-banner" class="error-banner"></div>

          <div class="status-bar">
            <div class="status-left">
              <span class="indicator pulse-glow"></span>
              <span style="color: var(--cui-accent-green)" class="font-mono"
                >STATUS: Active</span
              >
            </div>
            <div class="user-info">
              <span class="user-badge" id="user-display">Guest</span>
              <button class="logout-btn" id="logout-btn" onclick="logout()">
                Logout
              </button>
            </div>
          </div>

          <div
            id="chat-messages"
            class="messages-wrapper"
            aria-live="polite"
          ></div>

          <form id="chat-form" class="input-row" onsubmit="sendMessage(event)">
            <input
              id="chat-input"
              type="text"
              placeholder="Ask about CUI campus, admissions, schedules..."
              autocomplete="off"
            />
            <button
              type="submit"
              id="send-btn"
              class="send-btn"
              aria-label="Send message"
            >
              <span>Send</span>
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </section>

    <script>
      const API_BASE = '/api';
      const chatMessages = document.getElementById('chat-messages');
      const chatInput = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');
      const errorBanner = document.getElementById('error-banner');
      const userDisplay = document.getElementById('user-display');

      // Get stored token
      function getToken() {
        return localStorage.getItem('cui_access_token');
      }

      // Get stored user
      function getUser() {
        const user = localStorage.getItem('cui_user');
        return user ? JSON.parse(user) : null;
      }

      // Check authentication
      function checkAuth() {
        const token = getToken();
        const user = getUser();

        if (!token) {
          window.location.href = '/login';
          return false;
        }

        if (user) {
          userDisplay.textContent =
            user.username + (user.role === 'admin' ? ' (Admin)' : '');
        }

        return true;
      }

      // Logout
      function logout() {
        localStorage.removeItem('cui_access_token');
        localStorage.removeItem('cui_user');
        window.location.href = '/login';
      }

      // Show error
      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        setTimeout(() => {
          errorBanner.style.display = 'none';
        }, 5000);
      }

      /**
       * Convert plain-text URLs into clickable <a> links (opens in new tab)
       */
      function linkifyText(text) {
        const escaped = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        return escaped.replace(
          /(https?:\/\/[^\s)<>]+)/gi,
          '<a href="$1" target="_blank" rel="noopener noreferrer" style="color: #00e5ff; text-decoration: underline; word-break: break-all;">$1</a>',
        );
      }

      // Append message
      function appendMsg(text, type, sources = [], isTyping = false) {
        const div = document.createElement('div');
        div.className =
          'msg ' + type + (isTyping ? ' typing' : '') + ' animated-element';

        // Main text — linkify URLs so they are clickable
        const textSpan = document.createElement('div');
        textSpan.innerHTML = linkifyText(text);
        div.appendChild(textSpan);

        // Sources (if bot message with sources)
        if (type === 'bot' && sources.length > 0 && !isTyping) {
          const sourcesDiv = document.createElement('div');
          sourcesDiv.className = 'msg-sources';
          sourcesDiv.innerHTML =
            '<strong>Sources:</strong> ' +
            sources.map((s) => `<span>${s}</span>`).join('');
          div.appendChild(sourcesDiv);
        }

        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
      }

      // Remove typing indicator
      function removeTypingIndicator() {
        const typing = chatMessages.querySelector('.msg.bot.typing');
        if (typing) typing.remove();
      }

      // Send message
      async function sendMessage(e) {
        if (e) e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        const token = getToken();
        if (!token) {
          showError('Session expired. Please login again.');
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
          return;
        }

        // Add user message
        appendMsg(text, 'user');
        chatInput.value = '';
        sendBtn.disabled = true;

        // Add typing indicator
        appendMsg('Thinking...', 'bot', [], true);

        try {
          const response = await fetch(`${API_BASE}/chat/`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ message: text }),
          });

          removeTypingIndicator();

          if (response.status === 401) {
            showError('Session expired. Please login again.');
            localStorage.removeItem('cui_access_token');
            localStorage.removeItem('cui_user');
            setTimeout(() => {
              window.location.href = '/login';
            }, 2000);
            return;
          }

          const data = await response.json();

          if (data.success) {
            appendMsg(data.answer, 'bot', data.sources || []);
          } else {
            appendMsg(
              'Error: ' + (data.detail || 'Something went wrong'),
              'bot',
            );
          }
        } catch (err) {
          removeTypingIndicator();
          appendMsg('Network error. Please try again.', 'bot');
        }

        sendBtn.disabled = false;
        chatInput.focus();
      }

      // Initialize
      window.addEventListener('load', () => {
        if (checkAuth()) {
          appendMsg(
            "Welcome! I'm the CUI Campus Bot. Ask me anything about COMSATS University Islamabad, Vehari Campus - admissions, programs, timetables, scholarships, and more.",
            'bot',
          );
        }
      });
    </script>
  </body>
</html>
